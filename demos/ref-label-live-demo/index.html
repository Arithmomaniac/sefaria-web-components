<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: Canvas;
        color: CanvasText;
      }

      main {
        width: min(64rem, 100%);
        margin: auto;
        padding: 2rem;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(18rem, 0.8fr) minmax(0, 1.2fr);
        gap: 1rem;
      }

      .panel {
        min-width: 0;
        padding: 1.25rem;
        border: 1px solid GrayText;
        border-radius: 0.75rem;
      }

      .presets,
      form {
        display: grid;
        gap: 0.75rem;
      }

      label {
        display: grid;
        gap: 0.25rem;
      }

      button,
      input,
      select {
        min-height: 2.5rem;
        font: inherit;
      }

      #request-state {
        color: GrayText;
      }

      #host-error {
        color: LinkText;
      }

      sefaria-ref-label {
        --sefaria-link: LinkText;
      }

      @media (max-width: 42rem) {
        main {
          padding: 1rem;
        }

        .workspace {
          grid-template-columns: 1fr;
        }
      }
    </style>
    <title>Live reference-label demo</title>
  </head>
  <body>
    <main>
      <header>
        <h1>Live reference-label demo</h1>
        <p>
          The host calls the deployed Sefaria API and supplies the result to a
          request-free Web Component.
        </p>
      </header>

      <div class="workspace">
        <section class="panel" aria-labelledby="request-heading">
          <h2 id="request-heading">Choose a reference</h2>
          <div class="presets" aria-label="Example references">
            <button
              type="button"
              data-demo-request
              data-demo-id="segment"
              data-tref="Genesis 1:1"
            >
              Segment
            </button>
            <button
              type="button"
              data-demo-request
              data-demo-id="range"
              data-tref="Genesis 1:1-3"
            >
              Range
            </button>
            <button
              type="button"
              data-demo-request
              data-demo-id="spanning"
              data-tref="Genesis 1:31-2:2"
            >
              Spanning range
            </button>
            <button
              type="button"
              data-demo-request
              data-demo-id="commentary"
              data-tref="Rashi on Genesis 1:1:1"
            >
              Commentary
            </button>
            <button
              type="button"
              data-demo-request
              data-demo-id="empty"
              data-tref="__missing_ref_label_probe__"
            >
              Unresolvable
            </button>
          </div>

          <form id="ref-request-form">
            <label>
              Sefaria reference
              <input name="tref" value="Genesis 1:1" required />
            </label>
            <label>
              Label language
              <select name="labelLanguage">
                <option value="english">English</option>
                <option value="hebrew">Hebrew</option>
                <option value="both" selected>Both</option>
              </select>
            </label>
            <label>
              <span>Link behavior</span>
              <span
                ><input name="linked" type="checkbox" checked /> Render a
                canonical link</span
              >
            </label>
            <button type="submit">Load from Sefaria</button>
          </form>
        </section>

        <section class="panel" aria-labelledby="result-heading">
          <h2 id="result-heading">Component result</h2>
          <p id="request-state" data-state="initial">
            Waiting for the first request.
          </p>
          <p id="host-error" role="alert" hidden></p>
          <sefaria-ref-label id="ref-result"></sefaria-ref-label>
        </section>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
