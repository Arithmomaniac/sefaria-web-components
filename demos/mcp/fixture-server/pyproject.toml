[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sefaria-mcp-app-fixture"
version = "0.0.0"
description = "Fixture-only FastMCP server for the Sefaria Web Components demo"
requires-python = ">=3.10"
dependencies = [
    "fastmcp==3.2.4",
    "jsonschema>=4.23,<5",
]

[project.scripts]
sefaria-mcp-app-fixture = "sefaria_mcp_fixture.server:main"

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
    "types-jsonschema>=4.23,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sefaria_mcp_fixture"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
warn_return_any = true
