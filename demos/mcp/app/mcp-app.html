<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Sefaria MCP App</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: var(--font-sans, system-ui, sans-serif);
        background: var(--color-background-primary, Canvas);
        color: var(--color-text-primary, CanvasText);
      }

      body {
        margin: 0;
        padding: 0.75rem;
      }

      #app {
        max-width: 48rem;
      }

      [role="alert"] {
        border: 1px solid var(--color-border-danger, #b3261e);
        border-radius: var(--border-radius-md, 0.5rem);
        padding: 1rem;
        color: var(--color-text-danger, #b3261e);
      }

      [role="alert"] ul {
        margin-block-end: 0;
        padding-inline-start: 1.5rem;
      }

      sefaria-source-card,
      sefaria-connections-panel {
        --sefaria-surface: var(--color-background-primary, Canvas);
        --sefaria-surface-muted: var(
          --color-background-secondary,
          var(--color-background-primary, Canvas)
        );
        --sefaria-fg: var(--color-text-primary, CanvasText);
        --sefaria-fg-muted: var(--color-text-secondary, GrayText);
        --sefaria-border: var(--color-border-secondary, #d5d5d4);
        --sefaria-accent: var(--color-text-info, #18345d);
        --sefaria-link: var(--color-text-info, #0b71e7);
        --sefaria-font-english: var(--font-sans, serif);
      }

      textarea[aria-label="Follow-up request"] {
        box-sizing: border-box;
        width: 100%;
        min-height: 5rem;
        margin-block-start: 0.5rem;
        padding: 0.5rem;
        color: inherit;
        background: var(--color-background-secondary, Canvas);
        border: 1px solid var(--color-border-secondary, #d5d5d4);
        border-radius: var(--border-radius-md, 0.5rem);
        font: inherit;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <p role="status">Waiting for a tool result</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
