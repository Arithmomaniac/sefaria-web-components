  <text x="203" y="544" font-size="9.5" font-weight="600" fill="#ff8fb0" font-family="Consolas, monospace">&lt;sefaria-attribution&gt;</text>

  <!-- rest of host page -->
  <text x="88" y="646" font-size="13.5" fill="#c8ccd2">Rashi, following the Sifra, reads it as the axis of the entire section — a</text>
  <text x="88" y="670" font-size="13.5" fill="#c8ccd2">claim the later commentators spend considerable effort qualifying.</text>

