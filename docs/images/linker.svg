  <!-- header -->
  <text x="388" y="392" text-anchor="middle" font-size="15.5" font-weight="600" fill="#e8e6e3">Leviticus 19:18</text>
  <text x="202" y="394" font-size="15" fill="#9aa0a6">✕</text>
  <line x1="176" y1="410" x2="600" y2="410" stroke="#2a2f38"/>

  <!-- body -->
  <text x="576" y="450" text-anchor="start" font-size="19" fill="#eceae7" direction="rtl" unicode-bidi="bidi-override" font-family="Taamey Frank CLM, SBL Hebrew, Times New Roman, serif">וְאָֽהַבְתָּ֥ לְרֵעֲךָ֖ כָּמ֑וֹךָ אֲנִ֖י יְהֹוָֽה׃</text>
  <text x="200" y="482" font-size="13.5" fill="#c8ccd2">Love your fellow as yourself: I am the LORD.</text>
  <text x="200" y="508" font-size="10.5" fill="#7d828a">The Contemporary Torah, JPS 2006 · CC-BY-NC</text>

