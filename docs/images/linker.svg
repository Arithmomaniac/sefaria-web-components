  <text x="672" y="129" text-anchor="middle" font-size="12" fill="#7d828a">☾</text>

  <!-- host page content -->
  <text x="88" y="192" font-size="19" font-weight="700" fill="#e8e6e3">Parashat Kedoshim: “A Great Principle”</text>
  <text x="88" y="216" font-size="11.5" fill="#7d828a">A reader’s blog · 6 min read · dark theme enabled</text>
  <line x1="88" y1="232" x2="684" y2="232" stroke="#2a2f38"/>

  <text x="88" y="266" font-size="13.5" fill="#c8ccd2">The verse that Rabbi Akiva singled out is short enough to miss on a first</text>
  <text x="88" y="290" font-size="13.5" fill="#c8ccd2">reading. It appears near the end of the chapter, at <tspan fill="#ff8fb0" text-decoration="underline">Leviticus 19:18</tspan>, and the</text>
  <text x="88" y="314" font-size="13.5" fill="#c8ccd2">whole of the surrounding passage turns on it.</text>

  <!-- ref-link callout -->
  <rect x="386" y="274" width="94" height="22" rx="5" fill="none" stroke="#e0407a" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="544" y="277" width="115" height="16" rx="4" fill="#241a20"/>
  <text x="551" y="289" font-size="9.5" font-weight="600" fill="#ff8fb0" font-family="Consolas, monospace">&lt;sefaria-ref-link&gt;</text>

