<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" font-family="Segoe UI, Aptos, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="760" height="600" fill="#f7f4ef"/>
  <rect x="40" y="30" width="680" height="540" rx="14" fill="#fff" stroke="#d8d4ce" filter="url(#shadow)"/>
  <rect x="40" y="30" width="680" height="44" rx="14" fill="#f0ede8"/>
  <rect x="40" y="58" width="680" height="16" fill="#f0ede8"/>
  <circle cx="64" cy="52" r="5" fill="#d2cdc5"/>
  <circle cx="82" cy="52" r="5" fill="#d2cdc5"/>
  <circle cx="100" cy="52" r="5" fill="#d2cdc5"/>
  <text x="380" y="57" text-anchor="middle" font-size="13" font-weight="600" fill="#69655f">VS Code · Copilot Chat</text>

  <rect x="370" y="98" width="322" height="42" rx="12" fill="#9f1d49"/>
  <text x="674" y="124" text-anchor="end" font-size="14" fill="#fff">Show me Genesis 1:1.</text>
  <text x="68" y="176" font-size="14" fill="#25231f">The tool returned data, but the App rejected it before projection.</text>

  <rect x="68" y="208" width="624" height="240" rx="10" fill="#fff7f6" stroke="#b3261e" stroke-width="1.5"/>
  <circle cx="102" cy="246" r="15" fill="#b3261e"/>
  <text x="102" y="252" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">!</text>
  <text x="130" y="244" font-size="15" font-weight="700" fill="#8f1d18">Sefaria MCP App could not render this result.</text>
  <text x="92" y="286" font-size="12.5" font-family="Consolas, monospace" fill="#25231f">/versions</text>
  <text x="208" y="286" font-size="12.5" fill="#5e5954">Expected array, received string.</text>
  <text x="92" y="318" font-size="12.5" font-family="Consolas, monospace" fill="#25231f">/warnings/0</text>
  <text x="208" y="318" font-size="12.5" fill="#5e5954">Expected an object with at least one property.</text>
  <line x1="92" y1="346" x2="668" y2="346" stroke="#ecd0cd"/>
  <text x="92" y="376" font-size="12.5" fill="#8f1d18">No component factory was called.</text>
  <text x="92" y="400" font-size="12.5" fill="#8f1d18">The App made no fallback request.</text>

  <rect x="68" y="478" width="624" height="32" rx="16" fill="#fafafa" stroke="#dedbd5"/>
  <text x="88" y="499" font-size="12.5" fill="#9a9690">Ask a follow-up…</text>
</svg>
