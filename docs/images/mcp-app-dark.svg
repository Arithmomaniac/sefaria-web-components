<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 720" width="760" height="720" font-family="Segoe UI, Aptos, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="760" height="720" fill="#151515"/>
  <rect x="40" y="30" width="680" height="660" rx="14" fill="#202020" stroke="#424242" filter="url(#shadow)"/>
  <rect x="40" y="30" width="680" height="44" rx="14" fill="#2b2b2b"/>
  <rect x="40" y="58" width="680" height="16" fill="#2b2b2b"/>
  <circle cx="64" cy="52" r="5" fill="#565656"/>
  <circle cx="82" cy="52" r="5" fill="#565656"/>
  <circle cx="100" cy="52" r="5" fill="#565656"/>
  <text x="380" y="57" text-anchor="middle" font-size="13" font-weight="600" fill="#d0d0d0">VS Code · Copilot Chat · Dark theme</text>

  <rect x="250" y="96" width="442" height="42" rx="12" fill="#b12a59"/>
  <text x="674" y="122" text-anchor="end" font-size="14" fill="#fff">Show me Leviticus 19:18 in Hebrew and English.</text>
  <text x="68" y="172" font-size="14" fill="#f0f0f0">The App inherits host colors and fonts, then maps them to Sefaria tokens.</text>

  <rect x="68" y="206" width="624" height="384" rx="10" fill="#2d2d2b" stroke="#51514e" stroke-width="1.5"/>
  <text x="88" y="240" font-size="16" font-weight="700" fill="#fff">Leviticus 19:18</text>
  <text x="672" y="240" text-anchor="end" font-size="16" font-weight="700" fill="#fff">ויקרא י״ט:י״ח</text>
  <line x1="88" y1="256" x2="672" y2="256" stroke="#50504d"/>

  <text x="380" y="302" text-anchor="middle" font-size="20" fill="#fff" direction="rtl" font-family="Noto Serif Hebrew, Times New Roman, serif">לֹא־תִקֹּם וְלֹא־תִטֹּר אֶת־בְּנֵי עַמֶּךָ</text>
  <text x="380" y="332" text-anchor="middle" font-size="20" fill="#fff" direction="rtl" font-family="Noto Serif Hebrew, Times New Roman, serif">וְאָהַבְתָּ לְרֵעֲךָ כָּמוֹךָ אֲנִי יְהוָה׃</text>
  <text x="88" y="378" font-size="15" fill="#f0f0f0">You shall not take vengeance or bear a grudge against members</text>
  <text x="88" y="401" font-size="15" fill="#f0f0f0">of your people. Love your fellow as yourself: I am the LORD.</text>

  <line x1="88" y1="438" x2="672" y2="438" stroke="#50504d"/>
  <text x="88" y="468" font-size="12.5" font-weight="600" fill="#ddd">Primary text:</text>
  <text x="173" y="468" font-size="12.5" fill="#ddd">Miqra according to the Masorah</text>
  <text x="88" y="494" font-size="12.5" font-weight="600" fill="#ddd">Translation:</text>
  <text x="173" y="494" font-size="12.5" fill="#ddd">The Contemporary Torah, JPS, 2006</text>

  <rect x="88" y="526" width="188" height="34" rx="17" fill="#4a2331"/>
  <circle cx="108" cy="543" r="5" fill="#58b86b"/>
  <text x="122" y="548" font-size="11.5" font-weight="600" fill="#f4c5d6">1 tool call · 0 App requests</text>

  <text x="68" y="628" font-size="14" fill="#f0f0f0">No App-specific dark palette is required; host variables drive the element tokens.</text>
  <rect x="68" y="648" width="624" height="32" rx="16" fill="#292929" stroke="#4c4c4c"/>
  <text x="88" y="669" font-size="12.5" fill="#929292">Ask a follow-up…</text>
</svg>
