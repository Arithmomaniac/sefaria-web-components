name: CI

on:
  pull_request:
    branches:
      - main
      - feature/avilevin/frontend-toolkit-alpha
  push:
    branches:
      - feature/avilevin/frontend-toolkit-alpha

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm setup:agent
      - run: pnpm check
        env:
          SITE_SCREENSHOT_DIR: .artifacts/site
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-${{ runner.os }}
          path: |
            .artifacts/check/result.json
            .artifacts/setup/result.json
            .artifacts/site/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  check:
    name: check
    if: ${{ always() }}
    needs: validation
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation platform
        run: |
          if [ "${{ needs.validation.result }}" != "success" ]; then
            echo "Validation result: ${{ needs.validation.result }}"
            exit 1
          fi
