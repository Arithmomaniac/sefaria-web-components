name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.23"
          enable-cache: true
          cache-dependency-glob: demos/mcp/fixture-server/requirements.lock
      - run: pnpm install --frozen-lockfile
      - run: pnpm install:python
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
