name: Copilot Setup Steps

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/scripts/detect-toolkit.mjs
      - .github/workflows/copilot-setup-steps.yml
  push:
    paths:
      - .github/scripts/detect-toolkit.mjs
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Detect toolkit checkout
        id: toolkit
        shell: bash
        run: node .github/scripts/detect-toolkit.mjs >> "$GITHUB_OUTPUT"
      - if: steps.toolkit.outputs.applicable == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.toolkit.outputs.applicable == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.toolkit.outputs.applicable == 'true'
        run: pnpm setup:agent
