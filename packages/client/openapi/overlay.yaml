overlay: 1.1.0
info:
  title: Sefaria Core API corrections
  version: 1.0.0
  description: Source-backed corrections for the six generated Core operations.
extends: ./upstream.json
x-sefaria-guards:
  - id: versions-contract
    preconditions:
      - target: $.paths['/api/texts/versions/{index}']
        expected:
          sha256: 7d3a1ad0fbf2dd65eccd3005a061806ef42ef87e4ce80629adb7f787c177e00b
      - target: $.paths['/api/texts/versions/{tref}']
        expected:
          absent: true
      - target: $.paths['/api/texts/versions/{index}'].parameters[0].name
        expected:
          value: index
      - target: $.paths['/api/texts/versions/{index}'].parameters[0]
        expected:
          sha256: 1e3ec10dc573a81e49858caf3ac37e8273658ad0f9e6b420ead36481118005fe
      - target: $.paths['/api/texts/versions/{index}'].get.responses['200'].content['VersionJSON']
        expected:
          sha256: faed8c019245e012ec007a4b21ff79d632276a334f3f1ebd6df07f569702b584
      - target: $.paths['/api/texts/versions/{index}'].get.responses['200'].content['application/json']
        expected:
          absent: true
      - target: $.components.schemas.VersionJSON.properties.versionSource.type
        expected:
          value: string
      - target: $.components.schemas.VersionJSON.properties.versionSource
        expected:
          sha256: 60ad2aadf74669729dbc29919f5b0efdaf80c0ef4a17441689be60b7be2c83a2
      - target: $.components.schemas.VersionJSON.properties.versionSource.nullable
        expected:
          absent: true
      - target: $.components.schemas.VersionJSON.properties.status.type
        expected:
          value: string
      - target: $.components.schemas.VersionJSON.properties.status
        expected:
          sha256: 56639d0f6f8295dcda98974d90ae7eaa4d0bc59f0eb5acd7457b65fb1d4421c4
      - target: $.components.schemas.VersionJSON.properties.status.nullable
        expected:
          absent: true
  - id: v3-text-contract
    preconditions:
      - target: $.components.schemas.CoreErrorResponse
        expected:
          absent: true
      - target: $.components.schemas.CoreStringArrayOrNull
        expected:
          absent: true
      - target: $.components.schemas.CoreV3TextValue
        expected:
          absent: true
      - target: $.components.schemas.CoreV3WarningDetail
        expected:
          absent: true
      - target: $.components.schemas.CoreV3Warning
        expected:
          absent: true
      - target: $.components.schemas.CoreV3AvailableVersion
        expected:
          absent: true
      - target: $.components.schemas.CoreV3VersionMetadata
        expected:
          absent: true
      - target: $.components.schemas.CoreV3Version
        expected:
          absent: true
      - target: $.components.schemas.CoreV3TextsResponse
        expected:
          absent: true
      - target: $.paths['/api/v3/texts/{tref}'].parameters[0].name
        expected:
          value: version
      - target: $.paths['/api/v3/texts/{tref}'].parameters[0]
        expected:
          sha256: b3ba871f7846c58a5ade9ec7832a60eaeaece89cec4e31aa3afb66483a416836
      - target: $.paths['/api/v3/texts/{tref}'].parameters[0].schema
        expected:
          value:
            type: string
      - target: $.paths['/api/v3/texts/{tref}'].get.responses['200'].content['application/json'].schema['$ref']
        expected:
          value: "#/components/schemas/v3TextsJson"
      - target: $.paths['/api/v3/texts/{tref}'].get.responses['400']
        expected:
          absent: true
      - target: $.paths['/api/v3/texts/{tref}'].get.responses['404']
        expected:
          absent: true
  - id: ref-contract
    preconditions:
      - target: $.paths['/api/ref/{tref}'].get.description
        expected:
          value:
            "Validates a text reference (`tref`) and returns structured metadata about it.


            The response varies based on the `node_type` of the referenced text:


            - **JaggedArrayNode**: Standard text nodes (e.g. biblical chapters/verses, Talmud pages). Returns `depth`, `address_types`, `section_names`, and positional indexes/labels.

            - **SchemaNode**: Nodes with named children (e.g. a commentary with an introduction and main text). Returns `children` list.

            - **DictionaryEntryNode**: Individual dictionary entries. Returns `lexicon_name` and `headword`, plus the JaggedArrayNode fields.

            - **DictionaryNode**: Dictionary root nodes. Returns `lexicon_name`.

            - **SheetNode**: User-created source sheets. Returns `sheet_id`.


            If the node has a default child (a child node that represents the primary content), the response includes a `default_child_node` object with the child's `node_type`, `node_index`, and optionally `depth`, `address_types` and `sectionNames` (for JaggedArrayNode children) or `lexicon_name` (for DictionaryNode parents).


            All types include `navigation_refs` with `shortest_path_to_root` (array of ancestor refs from immediate parent to book level) and `first_available_section_ref`. Segment-level refs also get `prev_segment_ref`/`next_segment_ref`, and section-level refs get `prev_section_ref`/`next_section_ref`."
      - target: $.components.schemas.CoreRefNavigation
        expected:
          absent: true
      - target: $.components.schemas.CoreRefSuccess
        expected:
          absent: true
      - target: $.components.schemas.CoreRefResponse
        expected:
          absent: true
      - target: $.paths['/api/ref/{tref}'].get.responses['200'].content['application/json'].schema['$ref']
        expected:
          value: "#/components/schemas/RefJSON"
      - target: $.paths['/api/ref/{tref}'].get.responses['404'].content['application/json'].schema
        expected:
          value:
            type: object
            properties:
              error:
                type: string
  - id: index-contract
    preconditions:
      - target: $.paths['/api/v2/index/{title}'].get.parameters
        expected:
          sha256: 25c871bb3cf96c48b6725f31345c4677d2bda9ff1312445de5d4e95ddab355a2
      - target: $.components.schemas.CoreIndexResponse
        expected:
          absent: true
      - target: $.components.schemas.IndexJSON
        expected:
          sha256: 5e033d42164a6c3080e6bcab9aaaf42347f013ccbe4dfff4b40fe52583d670b9
      - target: $.paths['/api/v2/index/{title}'].get.responses['200'].content['application/json'].schema['$ref']
        expected:
          value: "#/components/schemas/IndexJSON"
  - id: shape-contract
    preconditions:
      - target: $.components.schemas.CoreShapeChapter
        expected:
          absent: true
      - target: $.components.schemas.CoreShapeLeafRecord
        expected:
          absent: true
      - target: $.components.schemas.CoreShapeCollapsedRecord
        expected:
          absent: true
      - target: $.components.schemas.CoreShapeRecord
        expected:
          absent: true
      - target: $.components.schemas.CoreShapeResponse
        expected:
          absent: true
      - target: $.paths['/api/shape/{title}'].get.responses['200'].content['application/json'].schema['$ref']
        expected:
          value: "#/components/schemas/ShapeJSON"
      - target: $.paths['/api/shape/{title}'].parameters[1]
        expected:
          sha256: f209270e54909395df3056cb9732ab65fdbd1d9d1394d1083a59c011ca1f0ff4
      - target: $.paths['/api/shape/{title}'].parameters[2]
        expected:
          sha256: ec346ea97c63dab3d16dda628d4d26edf192ddbeb800e877ec2993cb979f3115
      - target: $.paths['/api/shape/{title}'].get.responses['200'].content['application/json'].examples
        expected:
          sha256: 5f15e9aad060cf74fddf876e7087ee70da1548c31a6705cee84a999493199786
      - target: $.paths['/api/shape/{title}'].get.responses['200'].content['application/json'].examples['Simple Text'].value
        expected:
          sha256: 77d1a5ac670e40a69925007d151805ea6d321e6a6f2f89e65a09ffd68108d08a
      - target: $.paths['/api/shape/{title}'].get.responses['200'].content['application/json'].examples['Complex Text'].value
        expected:
          sha256: 98e56c88b6fb29a2d41363e5f7b24846d7dca7a7d064f075e08c77760e9d18b6
      - target: $.paths['/api/shape/{title}'].get.responses['200'].content['application/json'].examples['Simple Text']['x-sefaria-original-value']
        expected:
          absent: true
      - target: $.paths['/api/shape/{title}'].get.responses['200'].content['application/json'].examples['Complex Text']['x-sefaria-original-value']
        expected:
          absent: true
  - id: links-contract
    preconditions:
      - target: $.components.schemas.CoreLinkVersion
        expected:
          absent: true
      - target: $.components.schemas.CoreLinkObject
        expected:
          absent: true
      - target: $.components.schemas.CoreSheetLinkObject
        expected:
          absent: true
      - target: $.components.schemas.CoreLinkResponse
        expected:
          absent: true
      - target: $.components.schemas.CoreLinksErrorResponse
        expected:
          absent: true
      - target: $.paths['/api/links/{tref}'].get.parameters[2]
        expected:
          sha256: 202a934c4f87fcc0ec5ccdc61e1612c2007ea16b574dcdf944b7ea15d5809c2b
      - target: $.paths['/api/links/{tref}'].get.responses['200'].content['application/json'].schema
        expected:
          sha256: cf4a94c306c4de8bbe62acb7c3abb511ec4a0902309132548df13257a8f63c57
      - target: $.paths['/api/links/{tref}'].get.responses['400']
        expected:
          absent: true
actions:
  - x-action-id: versions-path-seed
    x-correction-id: versions-contract
    target: "$.paths"
    description: Create the corrected tref path before copying the upstream operation.
    update:
      "/api/texts/versions/{tref}": {}
  - x-action-id: versions-path-copy
    x-correction-id: versions-contract
    target: "$.paths['/api/texts/versions/{tref}']"
    description: Copy the complete versions operation to the corrected tref path.
    copy: "$.paths['/api/texts/versions/{index}']"
  - x-action-id: versions-path-remove
    x-correction-id: versions-contract
    target: "$.paths['/api/texts/versions/{index}']"
    description: Remove the incorrectly named index path.
    remove: true
  - x-action-id: versions-parameter
    x-correction-id: versions-contract
    target: "$.paths['/api/texts/versions/{tref}'].parameters[0]"
    description: Match the path parameter to the route and handler.
    update:
      name: tref
      description: A valid Sefaria reference.
  - x-action-id: versions-content-seed
    x-correction-id: versions-contract
    target: "$.paths['/api/texts/versions/{tref}'].get.responses['200'].content"
    description: Create the JSON media-type key before copying its schema.
    update:
      application/json: {}
  - x-action-id: versions-content-copy
    x-correction-id: versions-contract
    target: "$.paths['/api/texts/versions/{tref}'].get.responses['200'].content['application/json']"
    description: Copy the version-list schema under the correct JSON media type.
    copy: "$.paths['/api/texts/versions/{tref}'].get.responses['200'].content['VersionJSON']"
  - x-action-id: versions-response-schema-remove
    x-correction-id: versions-contract
    target: "$.paths['/api/texts/versions/{tref}'].get.responses['200'].content['application/json'].schema"
    description: Remove the array-only schema before adding the source error branch.
    remove: true
  - x-action-id: versions-response-schema
    x-correction-id: versions-contract
    target: "$.paths['/api/texts/versions/{tref}'].get.responses['200'].content['application/json']"
    description: Model successful version metadata arrays and HTTP 200 JSON errors.
    update:
      schema:
        oneOf:
          - type: array
            items:
              $ref: "#/components/schemas/VersionJSON"
          - $ref: "#/components/schemas/CoreErrorResponse"
  - x-action-id: versions-content-remove
    x-correction-id: versions-contract
    target: "$.paths['/api/texts/versions/{tref}'].get.responses['200'].content['VersionJSON']"
    description: Remove the schema name that was incorrectly used as a media type.
    remove: true
  - x-action-id: versions-version-source-nullable
    x-correction-id: versions-contract
    target: "$.components.schemas.VersionJSON.properties.versionSource"
    description: Permit stored version metadata whose required source value is null.
    update:
      nullable: true
  - x-action-id: versions-status-nullable
    x-correction-id: versions-contract
    target: "$.components.schemas.VersionJSON.properties.status"
    description: Permit stored version metadata whose optional status value is null.
    update:
      nullable: true
  - x-action-id: v3-version-parameter
    x-correction-id: v3-text-contract
    target: "$.paths['/api/v3/texts/{tref}'].parameters[0]"
    description: Model the repeatable version selector read through request.GET.getlist.
    update:
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
  - x-action-id: v3-schemas
    x-correction-id: v3-text-contract
    target: "$.components.schemas"
    description: Add the source-backed v3 response, warning, error, and recursive value schemas.
    update:
      CoreErrorResponse:
        type: object
        required:
          - error
        properties:
          error:
            type: string
      CoreStringArrayOrNull:
        description: A string, null, or recursively nested list of the same values.
        oneOf:
          - type: string
          - type: array
            items:
              $ref: "#/components/schemas/CoreStringArrayOrNull"
          - type: string
            nullable: true
            enum:
              - null
      CoreV3TextValue:
        description: A nullable text segment or recursively nested text segments.
        oneOf:
          - type: string
          - type: array
            items:
              $ref: "#/components/schemas/CoreV3TextValue"
          - type: string
            nullable: true
            enum:
              - null
      CoreV3WarningDetail:
        type: object
        required:
          - warning_code
          - message
        properties:
          warning_code:
            type: integer
          message:
            type: string
      CoreV3Warning:
        type: object
        minProperties: 1
        additionalProperties:
          $ref: "#/components/schemas/CoreV3WarningDetail"
      CoreV3VersionMetadata:
        allOf:
          - $ref: "#/components/schemas/VersionJSON"
          - type: object
            required:
              - versionTitle
              - versionSource
              - language
              - actualLanguage
              - languageFamilyName
              - isSource
              - isPrimary
              - direction
            properties:
              versionTitle:
                type: string
              versionSource:
                type: string
                nullable: true
              language:
                $ref: "#/components/schemas/LanguageCode"
              actualLanguage:
                type: string
              languageFamilyName:
                type: string
              isSource:
                type: boolean
              isPrimary:
                type: boolean
              direction:
                type: string
                enum:
                  - ltr
                  - rtl
              formatAsPoetry:
                oneOf:
                  - type: boolean
                  - type: string
              hasManuallyWrappedRefs:
                oneOf:
                  - type: boolean
                  - type: string
      CoreV3AvailableVersion:
        allOf:
          - $ref: "#/components/schemas/CoreV3VersionMetadata"
          - type: object
            required:
              - title
            properties:
              title:
                type: string
      CoreV3Version:
        allOf:
          - $ref: "#/components/schemas/CoreV3VersionMetadata"
          - type: object
            required:
              - text
            properties:
              text:
                $ref: "#/components/schemas/CoreV3TextValue"
              firstSectionRef:
                type: string
              sources:
                $ref: "#/components/schemas/CoreStringArrayOrNull"
      CoreV3TextsResponse:
        type: object
        required:
          - versions
          - available_versions
          - ref
          - heRef
          - sections
          - toSections
          - sectionRef
          - heSectionRef
          - firstAvailableSectionRef
          - isSpanning
          - next
          - prev
          - title
          - book
          - heTitle
          - primary_category
          - type
          - indexTitle
          - categories
          - heIndexTitle
          - isComplex
          - isDependant
          - order
          - collectiveTitle
          - heCollectiveTitle
          - alts
          - textDepth
          - sectionNames
          - addressTypes
          - titleVariants
          - heTitleVariants
          - warnings
        properties:
          versions:
            type: array
            items:
              $ref: "#/components/schemas/CoreV3Version"
          available_versions:
            type: array
            items:
              $ref: "#/components/schemas/CoreV3AvailableVersion"
          ref:
            $ref: "#/components/schemas/ref"
          heRef:
            type: string
          sections:
            type: array
            items:
              type: string
          toSections:
            type: array
            items:
              type: string
          sectionRef:
            $ref: "#/components/schemas/ref"
          heSectionRef:
            type: string
          firstAvailableSectionRef:
            type: string
          isSpanning:
            type: boolean
          spanningRefs:
            type: array
            items:
              $ref: "#/components/schemas/ref"
          next:
            type: string
            nullable: true
          prev:
            type: string
            nullable: true
          title:
            type: string
          book:
            type: string
          heTitle:
            type: string
          primary_category:
            type: string
          type:
            type: string
          indexTitle:
            type: string
          categories:
            type: array
            items:
              type: string
          heIndexTitle:
            type: string
          isComplex:
            type: boolean
          isDependant:
            type: boolean
          order:
            oneOf:
              - type: array
                items:
                  type: integer
              - type: string
          collectiveTitle:
            type: string
          heCollectiveTitle:
            type: string
          alts:
            type: array
          lengths:
            type: array
            items:
              type: integer
          length:
            type: integer
          textDepth:
            type: integer
            nullable: true
          sectionNames:
            type: array
            nullable: true
            items:
              type: string
          addressTypes:
            type: array
            nullable: true
            items:
              type: string
          titleVariants:
            type: array
            items:
              type: string
          heTitleVariants:
            type: array
            items:
              type: string
          index_offsets_by_depth:
            type: object
          linker_output:
            type: array
            items:
              type: object
          warnings:
            type: array
            items:
              $ref: "#/components/schemas/CoreV3Warning"
  - x-action-id: v3-responses
    x-correction-id: v3-text-contract
    target: "$.paths['/api/v3/texts/{tref}'].get.responses"
    description: Correct the success schema and document the handler's JSON error statuses.
    update:
      "200":
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoreV3TextsResponse"
      "400":
        description: Invalid return format or text adapter failure.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoreErrorResponse"
      "404":
        description: Invalid, empty, or unavailable reference.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoreErrorResponse"
  - x-action-id: ref-description
    x-correction-id: ref-contract
    target: "$.paths['/api/ref/{tref}'].get.description"
    description: Correct the conditional navigation-field documentation.
    update: |-
      Validates a text reference (`tref`) and returns structured metadata about it.

      The response varies based on the `node_type` of the referenced text:

      - **JaggedArrayNode**: Standard text nodes (e.g. biblical chapters/verses, Talmud pages). Returns `depth`, `address_types`, `section_names`, and positional indexes/labels.
      - **SchemaNode**: Nodes with named children (e.g. a commentary with an introduction and main text). Returns `children` list.
      - **DictionaryEntryNode**: Individual dictionary entries. Returns `lexicon_name` and `headword`, plus the JaggedArrayNode fields.
      - **DictionaryNode**: Dictionary root nodes. Returns `lexicon_name`.
      - **SheetNode**: User-created source sheets. Returns `sheet_id`.

      If the node has a default child (a child node that represents the primary content), the response includes a `default_child_node` object with the child's `node_type`, `node_index`, and optionally `depth`, `address_types` and `sectionNames` (for JaggedArrayNode children) or `lexicon_name` (for DictionaryNode parents).

      Navigation fields depend on node type and reference depth. `navigation_refs.shortest_path_to_root` is always present. Non-`SheetNode` responses also include `first_available_section_ref`. Segment-level refs include `prev_segment_ref` and `next_segment_ref`; section-level refs include `prev_section_ref` and `next_section_ref`. Refs with a node depth that are neither ranges nor segment-level include `first_subref` and `last_subref`. `SheetNode` responses omit `first_available_section_ref` and previous/next navigation, but can include `first_subref` and `last_subref`.
  - x-action-id: ref-schemas
    x-correction-id: ref-contract
    target: "$.components.schemas"
    description: Add the parse-failure and node-dependent reference response union.
    update:
      CoreRefNavigation:
        type: object
        required:
          - shortest_path_to_root
        properties:
          shortest_path_to_root:
            type: array
            items:
              type: string
          first_available_section_ref:
            type: string
            nullable: true
          prev_segment_ref:
            type: string
            nullable: true
          next_segment_ref:
            type: string
            nullable: true
          prev_section_ref:
            type: string
            nullable: true
          next_section_ref:
            type: string
            nullable: true
          first_subref:
            type: string
          last_subref:
            type: string
      CoreRefSuccess:
        type: object
        required:
          - is_ref
          - normalized
          - hebrew
          - url_ref
          - index_title
          - node_type
          - navigation_refs
        properties:
          is_ref:
            type: boolean
            enum:
              - true
          normalized:
            type: string
          hebrew:
            type: string
          url_ref:
            type: string
          index_title:
            type: string
          node_type:
            type: string
          navigation_refs:
            $ref: "#/components/schemas/CoreRefNavigation"
          depth:
            type: integer
          address_types:
            type: array
            items:
              type: string
          section_names:
            type: array
            items:
              type: string
          start_indexes:
            type: array
            items:
              type: integer
          start_labels:
            type: array
            items:
              type: string
          end_indexes:
            type: array
            items:
              type: integer
          end_labels:
            type: array
            items:
              type: string
          children:
            type: array
            items:
              type: string
          lexicon_name:
            type: string
          headword:
            type: string
          sheet_id:
            type: integer
          default_child_node:
            type: object
            required:
              - node_type
              - node_index
            properties:
              node_type:
                type: string
              node_index:
                type: integer
              depth:
                type: integer
              address_types:
                type: array
                items:
                  type: string
              sectionNames:
                type: array
                items:
                  type: string
              lexicon_name:
                type: string
      CoreRefResponse:
        oneOf:
          - type: object
            required:
              - is_ref
            properties:
              is_ref:
                type: boolean
                enum:
                  - false
            additionalProperties: false
          - $ref: "#/components/schemas/CoreRefSuccess"
  - x-action-id: ref-success
    x-correction-id: ref-contract
    target: "$.paths['/api/ref/{tref}'].get.responses['200'].content['application/json'].schema['$ref']"
    description: Use the success-or-expected-parse-failure union for HTTP 200.
    update: "#/components/schemas/CoreRefResponse"
  - x-action-id: ref-error-remove
    x-correction-id: ref-contract
    target: "$.paths['/api/ref/{tref}'].get.responses['404'].content['application/json'].schema"
    description: Remove the incomplete inline error schema.
    remove: true
  - x-action-id: ref-error
    x-correction-id: ref-contract
    target: "$.paths['/api/ref/{tref}'].get.responses['404'].content['application/json']"
    description: Reference the required Core JSON error schema.
    update:
      schema:
        $ref: "#/components/schemas/CoreErrorResponse"
  - x-action-id: index-query
    x-correction-id: index-contract
    target: "$.paths['/api/v2/index/{title}'].get.parameters"
    description: Add the source-backed conditional response query parameters.
    update:
      - name: with_content_counts
        description: Annotate schema leaves with content_counts and add firstSectionRef.
        schema:
          type: string
          enum:
            - "0"
            - "1"
          default: "0"
        in: query
      - name: with_related_topics
        description: Add relatedTopics for the requested index.
        schema:
          type: string
          enum:
            - "0"
            - "1"
          default: "0"
        in: query
  - x-action-id: index-base-schema
    x-correction-id: index-contract
